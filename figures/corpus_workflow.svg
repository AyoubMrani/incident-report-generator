<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fb4" stroke="none"/>
    </marker>
  </defs>

  <!-- 1 incident asked -->
  <rect x="40" y="40" width="180" height="52" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.3"/>
  <text x="130" y="62" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Engineer asks</text>
  <text x="130" y="79" font-size="10.5" text-anchor="middle" stroke="none">a new incident question</text>

  <line x1="220" y1="66" x2="266" y2="66" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 2 assistant answers -->
  <rect x="270" y="40" width="180" height="52" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="360" y="62" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Assistant answers</text>
  <text x="360" y="79" font-size="10.5" text-anchor="middle" stroke="none">grounded in cited reports</text>

  <line x1="450" y1="66" x2="496" y2="66" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 3 resolved -->
  <rect x="500" y="40" width="160" height="52" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.3"/>
  <text x="580" y="62" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Incident resolved</text>
  <text x="580" y="79" font-size="10.5" text-anchor="middle" stroke="none">dialogue holds the fix</text>

  <path d="M 580 92 L 580 130" fill="none" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 4 synthesis -->
  <rect x="460" y="130" width="200" height="62" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="560" y="151" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Report synthesis</text>
  <text x="560" y="168" font-size="10.5" text-anchor="middle" stroke="none">dialogue → (metadata, blocks)</text>
  <text x="560" y="184" font-size="10" text-anchor="middle" stroke="none" font-style="italic">unfilled fields left empty</text>

  <path d="M 460 161 L 400 161" fill="none" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 5 validated + persisted -->
  <rect x="200" y="130" width="196" height="62" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="298" y="151" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Validated &amp; persisted</text>
  <text x="298" y="168" font-size="10.5" text-anchor="middle" stroke="none">same schema as authored reports</text>
  <text x="298" y="184" font-size="10" text-anchor="middle" stroke="none" font-style="italic">editable in the report editor</text>

  <path d="M 200 161 L 150 161 L 150 218" fill="none" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- 6 corpus -->
  <rect x="40" y="218" width="300" height="66" rx="6" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="190" y="240" font-size="12" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Shared corpus</text>
  <text x="190" y="258" font-size="10.5" text-anchor="middle" stroke="none">re-indexed in the background, on write</text>
  <text x="190" y="275" font-size="10.5" text-anchor="middle" stroke="none" font-weight="bold">answerable within seconds — no restart</text>

  <!-- loop back to the assistant -->
  <path d="M 340 251 L 400 251 L 400 215 L 360 215 L 360 96" fill="none" stroke="#1a5fb4" stroke-width="1.5"
        stroke-dasharray="6 3" marker-end="url(#ab)"/>
  <text x="412" y="230" font-size="10.5" stroke="none" fill="#1a5fb4">retrievable for the next question</text>

  <!-- failure-safety note -->
  <rect x="400" y="248" width="260" height="52" rx="5" fill="#fff" stroke="#111" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="530" y="266" font-size="10.5" text-anchor="middle" stroke="none" font-weight="bold">On a failed re-index</text>
  <text x="530" y="283" font-size="10.5" text-anchor="middle" stroke="none">the previous index keeps serving —</text>
  <text x="530" y="296" font-size="10.5" text-anchor="middle" stroke="none">an editor action cannot break the assistant</text>

  <text x="350" y="332" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">
    The corpus grows during an incident rather than after it: each resolution becomes evidence for the next.
  </text>
</svg>
