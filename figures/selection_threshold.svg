<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
  </defs>

  <!-- axis: sigma 0.0 .. 1.2 maps to x 80 .. 700 -->
  <line x1="80" y1="200" x2="710" y2="200" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="726" y="204" font-size="12" stroke="none" font-style="italic">σ</text>

  <!-- ticks -->
  <line x1="80"  y1="195" x2="80"  y2="205" stroke-width="1.2"/><text x="80"  y="222" font-size="10.5" text-anchor="middle" stroke="none">0.0</text>
  <line x1="235" y1="195" x2="235" y2="205" stroke-width="1.2"/><text x="235" y="222" font-size="10.5" text-anchor="middle" stroke="none">0.3</text>
  <line x1="390" y1="195" x2="390" y2="205" stroke-width="1.2"/><text x="390" y="222" font-size="10.5" text-anchor="middle" stroke="none">0.6</text>
  <line x1="545" y1="195" x2="545" y2="205" stroke-width="1.2"/><text x="545" y="222" font-size="10.5" text-anchor="middle" stroke="none">0.9</text>
  <line x1="700" y1="195" x2="700" y2="205" stroke-width="1.2"/><text x="700" y="222" font-size="10.5" text-anchor="middle" stroke="none">1.2</text>

  <!-- rejection / acceptance bands -->
  <rect x="80" y="176" width="178" height="24" fill="#fdeeee" stroke="none"/>
  <rect x="338" y="176" width="372" height="24" fill="#eef7ee" stroke="none"/>
  <line x1="80" y1="200" x2="710" y2="200" stroke-width="1.4"/>

  <!-- out-of-corpus points (below axis) -->
  <text x="150" y="268" font-size="11" text-anchor="middle" stroke="none" font-weight="bold" fill="#a51d2d">out of corpus</text>
  <circle cx="95"  cy="240" r="4.5" fill="#a51d2d" stroke="none"/>
  <circle cx="163" cy="240" r="4.5" fill="#a51d2d" stroke="none"/>
  <circle cx="226" cy="240" r="4.5" fill="#a51d2d" stroke="none"/>
  <circle cx="229" cy="240" r="4.5" fill="#a51d2d" stroke="none"/>
  <line x1="95"  y1="205" x2="95"  y2="236" stroke="#a51d2d" stroke-width="1"/>
  <line x1="163" y1="205" x2="163" y2="236" stroke="#a51d2d" stroke-width="1"/>
  <line x1="226" y1="205" x2="226" y2="236" stroke="#a51d2d" stroke-width="1"/>
  <line x1="229" y1="205" x2="229" y2="236" stroke="#a51d2d" stroke-width="1"/>
  <text x="150" y="288" font-size="10" text-anchor="middle" stroke="none">sourdough 0.029 · taxes 0.160</text>
  <text x="150" y="304" font-size="10" text-anchor="middle" stroke="none">COBOL 0.282 · guitar 0.288</text>

  <!-- documented incidents (above axis) -->
  <text x="618" y="112" font-size="11" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">documented incidents</text>
  <circle cx="618" cy="150" r="5.5" fill="#1a5fb4" stroke="none"/>
  <circle cx="618" cy="138" r="5.5" fill="#1a5fb4" stroke="none" opacity="0.55"/>
  <circle cx="618" cy="162" r="5.5" fill="#1a5fb4" stroke="none" opacity="0.55"/>
  <line x1="618" y1="168" x2="618" y2="196" stroke="#1a5fb4" stroke-width="1"/>
  <text x="618" y="132" font-size="10" text-anchor="middle" stroke="none">all 69 reports · σ ≈ 1.042</text>

  <!-- threshold -->
  <line x1="338" y1="60" x2="338" y2="252" stroke="#111" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="338" y="50" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">τ<tspan font-size="9" dy="3">abs</tspan><tspan dy="-3"> = 0.50</tspan></text>
  <text x="338" y="34" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">chosen in the gap</text>

  <!-- band labels -->
  <text x="205" y="170" font-size="11" text-anchor="end" stroke="none" fill="#a51d2d">cite nothing</text>
  <text x="360" y="170" font-size="11" stroke="none" fill="#2a7a2a">cite the report</text>

  <!-- the gap measurement -->
  <path d="M 232 258 L 232 268 L 612 268 L 612 258" fill="none" stroke="#111" stroke-width="1"/>
  <text x="422" y="284" font-size="11" text-anchor="middle" stroke="none">separation 0.288 → 1.042, no overlap</text>
</svg>
