<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 750 460" width="750" height="460"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fb4" stroke="none"/>
    </marker>
  </defs>

  <!-- ── Client tier ────────────────────────────────────────────── -->
  <rect x="120" y="20" width="520" height="72" rx="6" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="380" y="41" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">React single-page client</text>
  <rect x="150" y="52" width="200" height="28" rx="4" fill="#f2f2f2" stroke="#111" stroke-width="1"/>
  <text x="250" y="70" font-size="11.5" text-anchor="middle" stroke="none">Assistant module</text>
  <rect x="410" y="52" width="200" height="28" rx="4" fill="#f2f2f2" stroke="#111" stroke-width="1"/>
  <text x="510" y="70" font-size="11.5" text-anchor="middle" stroke="none">Report editor module</text>

  <line x1="250" y1="92" x2="250" y2="128" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="243" y="113" font-size="10.5" text-anchor="end" stroke="none">ask</text>
  <line x1="510" y1="92" x2="510" y2="128" stroke-width="1.2" marker-end="url(#ah)"/>
  <text x="518" y="113" font-size="10.5" stroke="none">author</text>

  <!-- ── Backend tier ───────────────────────────────────────────── -->
  <rect x="60" y="128" width="640" height="176" rx="6" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="380" y="149" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">FastAPI backend (single process)</text>

  <rect x="90" y="162" width="290" height="120" rx="5" fill="#fafafa" stroke="#111" stroke-width="1"/>
  <text x="235" y="181" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">RAG pipeline</text>
  <text x="105" y="201" font-size="10.5" stroke="none">intent routing → security screen</text>
  <text x="105" y="219" font-size="10.5" stroke="none">hybrid retrieval → source selection</text>
  <text x="105" y="237" font-size="10.5" stroke="none">generation → post-conditioning</text>
  <text x="105" y="262" font-size="10.5" stroke="none" font-style="italic">answer cache · embedding cache</text>

  <rect x="404" y="162" width="266" height="54" rx="5" fill="#fafafa" stroke="#111" stroke-width="1"/>
  <text x="537" y="181" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Report service</text>
  <text x="537" y="201" font-size="10.5" text-anchor="middle" stroke="none">CRUD · schema validation · HTML export</text>

  <rect x="404" y="228" width="266" height="54" rx="5" fill="#fafafa" stroke="#111" stroke-width="1"/>
  <text x="537" y="247" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Model provider interface</text>
  <text x="537" y="267" font-size="10.5" text-anchor="middle" stroke="none">text · vision — swappable by configuration</text>

  <!-- ── Local models ───────────────────────────────────────────── -->
  <rect x="404" y="340" width="266" height="80" rx="6" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="537" y="360" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">Locally-hosted models</text>
  <text x="537" y="379" font-size="10.5" text-anchor="middle" stroke="none">llama3.2:3b (text) · qwen2.5vl:3b (vision)</text>
  <text x="537" y="397" font-size="10.5" text-anchor="middle" stroke="none">all-MiniLM-L6-v2 (384-d embeddings)</text>
  <text x="537" y="413" font-size="10" text-anchor="middle" stroke="none" font-style="italic" fill="#1a5fb4">no external network call at query time</text>

  <line x1="537" y1="282" x2="537" y2="340" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- ── Shared corpus ──────────────────────────────────────────── -->
  <rect x="90" y="340" width="266" height="80" rx="6" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="223" y="363" font-size="12" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Shared report corpus</text>
  <text x="223" y="382" font-size="10.5" text-anchor="middle" stroke="none">69 structured reports (metadata, blocks)</text>
  <text x="223" y="400" font-size="10.5" text-anchor="middle" stroke="none">one schema: read, indexed, and written</text>

  <!-- corpus edges: read by pipeline, written by report service -->
  <line x1="190" y1="282" x2="190" y2="340" stroke="#1a5fb4" stroke-width="1.4" marker-end="url(#ahb)"/>
  <text x="182" y="316" font-size="10.5" text-anchor="end" stroke="none" fill="#1a5fb4">indexes</text>

  <path d="M 404 189 L 388 189 L 388 380 L 360 380" fill="none" stroke="#1a5fb4" stroke-width="1.4" marker-end="url(#ahb)"/>
  <text x="396" y="316" font-size="10.5" stroke="none" fill="#1a5fb4">writes</text>

  <!-- synthesis loop: answer becomes a report -->
  <path d="M 90 396 L 34 396 L 34 200 L 86 200" fill="none" stroke="#1a5fb4" stroke-width="1.4"
        stroke-dasharray="5 3" marker-end="url(#ahb)"/>
  <text x="26" y="298" font-size="10.5" stroke="none" fill="#1a5fb4" transform="rotate(-90 26 298)"
        text-anchor="middle">re-indexed on write</text>

  <text x="380" y="446" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">
    The corpus is the only coupling between the two modules — and the reason a resolved dialogue can become retrievable knowledge.
  </text>
</svg>
