<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
  </defs>

  <!-- source -->
  <rect x="30" y="46" width="220" height="230" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="140" y="68" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Report JSON</text>
  <text x="44" y="92" font-size="9.5" font-family="monospace" stroke="none">{ "metadata": {</text>
  <text x="44" y="107" font-size="9.5" font-family="monospace" stroke="none">    "incident_id": "INC1048202",</text>
  <text x="44" y="122" font-size="9.5" font-family="monospace" stroke="none">    "title": "Yellow Duplicate…" },</text>
  <text x="44" y="140" font-size="9.5" font-family="monospace" stroke="none">  "blocks": [</text>
  <text x="44" y="155" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">   { "id": "b4",</text>
  <text x="44" y="170" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">     "type": "paragraph",</text>
  <text x="44" y="185" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">     "level": 2,</text>
  <text x="44" y="200" font-size="9.5" font-family="monospace" stroke="none">     "content": "&lt;p&gt;duplicate</text>
  <text x="44" y="215" font-size="9.5" font-family="monospace" stroke="none">       rows inserted…&lt;/p&gt;" },</text>
  <text x="44" y="233" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">   { "type": "image",</text>
  <text x="44" y="248" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">     "data_url": "data:image/png;</text>
  <text x="44" y="263" font-size="9.5" font-family="monospace" stroke="none" fill="#a51d2d">        base64,iVBORw0KG…" } ] }</text>

  <!-- naive projection -->
  <path d="M 250 118 L 330 118" fill="none" stroke="#a51d2d" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="290" y="110" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">flatten</text>

  <rect x="334" y="80" width="200" height="78" rx="5" fill="#fdeeee" stroke="#a51d2d" stroke-width="1.3"/>
  <text x="434" y="99" font-size="11" text-anchor="middle" stroke="none" font-weight="bold" fill="#a51d2d">Naive: every key and value</text>
  <text x="346" y="118" font-size="9" font-family="monospace" stroke="none">id b4 type paragraph level 2</text>
  <text x="346" y="132" font-size="9" font-family="monospace" stroke="none">content p duplicate rows…</text>
  <text x="346" y="146" font-size="9" font-family="monospace" stroke="none">data_url data image png base64…</text>

  <path d="M 534 119 L 594 119" fill="none" stroke="#a51d2d" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="598" y="94" width="140" height="50" rx="5" fill="#fff" stroke="#a51d2d" stroke-width="1.2"/>
  <text x="668" y="113" font-size="10.5" text-anchor="middle" stroke="none" fill="#a51d2d">embeddings encode</text>
  <text x="668" y="129" font-size="10.5" text-anchor="middle" stroke="none" fill="#a51d2d" font-weight="bold">JSON syntax</text>

  <!-- schema-aware projection -->
  <path d="M 250 210 L 330 210" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="290" y="202" font-size="10" text-anchor="middle" stroke="none" fill="#1a5fb4">π, schema-aware</text>

  <rect x="334" y="168" width="200" height="96" rx="5" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="434" y="187" font-size="11" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Dispatch on block type</text>
  <text x="346" y="206" font-size="9.5" font-family="monospace" stroke="none"># Yellow Duplicate Cleanup</text>
  <text x="346" y="220" font-size="9.5" font-family="monospace" stroke="none">incident_id: INC1048202</text>
  <text x="346" y="234" font-size="9.5" font-family="monospace" stroke="none">Root Cause: duplicate rows</text>
  <text x="346" y="248" font-size="9.5" font-family="monospace" stroke="none">inserted… [SCREENSHOT 1]</text>

  <path d="M 534 216 L 594 216" fill="none" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="598" y="190" width="140" height="52" rx="5" fill="#fff" stroke="#1a5fb4" stroke-width="1.3"/>
  <text x="668" y="209" font-size="10.5" text-anchor="middle" stroke="none" fill="#1a5fb4">embeddings encode</text>
  <text x="668" y="225" font-size="10.5" text-anchor="middle" stroke="none" fill="#1a5fb4" font-weight="bold">incident meaning</text>

  <!-- notes -->
  <text x="434" y="290" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">
    Structural keys and base64 discarded; a screenshot becomes a positional marker
  </text>
  <text x="434" y="306" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">
    so the answer can acknowledge the visual instead of pretending it is absent.
  </text>

  <rect x="120" y="326" width="520" height="38" rx="5" fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="380" y="350" font-size="11" text-anchor="middle" stroke="none" font-weight="bold">
    No amount of ranking refinement compensates for an uninformative representation.
  </text>
</svg>
