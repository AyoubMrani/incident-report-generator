<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a51d2d" stroke="none"/>
    </marker>
  </defs>

  <!-- raw model output -->
  <rect x="40" y="30" width="180" height="90" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.4"/>
  <text x="130" y="52" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">Raw model output</text>
  <text x="130" y="72" font-size="10.5" text-anchor="middle" stroke="none">steps · artifacts</text>
  <text x="130" y="89" font-size="10.5" text-anchor="middle" stroke="none">citations · confidence</text>
  <text x="130" y="108" font-size="10" text-anchor="middle" stroke="none" font-style="italic">claims, not facts</text>

  <!-- evidence source -->
  <rect x="40" y="300" width="180" height="72" rx="6" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="130" y="322" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Selected reports</text>
  <text x="130" y="341" font-size="10.5" text-anchor="middle" stroke="none">full text, as retrieved</text>
  <text x="130" y="359" font-size="10" text-anchor="middle" stroke="none" font-style="italic">the ground truth</text>
  <path d="M 130 300 L 130 128" fill="none" stroke="#1a5fb4" stroke-width="1.3" stroke-dasharray="5 3"
        marker-end="url(#a)"/>
  <text x="122" y="215" font-size="10" text-anchor="end" stroke="none" fill="#1a5fb4"
        transform="rotate(-90 122 215)">checked against</text>

  <line x1="220" y1="75" x2="266" y2="75" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- four checks -->
  <rect x="270" y="30" width="300" height="52" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.2"/>
  <text x="284" y="49" font-size="11.5" stroke="none" font-weight="bold">Artifact grounding</text>
  <text x="284" y="66" font-size="10.5" stroke="none">identifiers must appear in the evidence</text>
  <line x1="570" y1="56" x2="622" y2="56" stroke="#a51d2d" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="700" y="52" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">removes “python menu.py”</text>
  <text x="700" y="66" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">borrowed from another incident</text>

  <line x1="420" y1="82" x2="420" y2="98" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="270" y="98" width="300" height="52" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.2"/>
  <text x="284" y="117" font-size="11.5" stroke="none" font-weight="bold">Stub removal</text>
  <text x="284" y="134" font-size="10.5" stroke="none">a keyword plus an ellipsis is not runnable</text>
  <line x1="570" y1="124" x2="622" y2="124" stroke="#a51d2d" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="700" y="128" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">removes “SELECT ...”</text>

  <line x1="420" y1="150" x2="420" y2="166" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="270" y="166" width="300" height="66" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.2"/>
  <text x="284" y="185" font-size="11.5" stroke="none" font-weight="bold">Confidence bounds</text>
  <text x="284" y="202" font-size="10.5" stroke="none">floor: strong match + grounded steps → ≥ 80%</text>
  <text x="284" y="219" font-size="10.5" stroke="none">ceilings: no steps → ≤ 40% · no source → ≤ 35%</text>
  <line x1="570" y1="199" x2="622" y2="199" stroke="#a51d2d" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="700" y="195" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">invented COBOL procedure</text>
  <text x="700" y="209" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">85% → 30%</text>

  <line x1="420" y1="232" x2="420" y2="248" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="270" y="248" width="300" height="66" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.2"/>
  <text x="284" y="267" font-size="11.5" stroke="none" font-weight="bold">Hazard annotation</text>
  <text x="284" y="284" font-size="10.5" stroke="none">documented destructive → caution</text>
  <text x="284" y="301" font-size="10.5" stroke="none">invented destructive → warning, uncited</text>
  <line x1="570" y1="281" x2="622" y2="281" stroke="#a51d2d" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="700" y="277" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">flags DROP TABLE</text>
  <text x="700" y="291" font-size="10" text-anchor="middle" stroke="none" fill="#a51d2d">never suppresses it</text>

  <line x1="420" y1="314" x2="420" y2="336" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- final -->
  <rect x="270" y="336" width="300" height="48" rx="6" fill="#eef7ee" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="420" y="357" font-size="12" text-anchor="middle" stroke="none" font-weight="bold" fill="#2a7a2a">Answer delivered to the client</text>
  <text x="420" y="375" font-size="10.5" text-anchor="middle" stroke="none">every claim traceable to a cited report</text>

  <text x="390" y="412" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">
    Each check can only remove content or lower confidence — none can add a claim the evidence does not support.
  </text>
</svg>
