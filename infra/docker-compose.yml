# Local stack for the NTT incident platform.
#
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up --build     # http://localhost:8000
#
# Services, ports and credentials: see docs/SERVICES.md.
# LLM: talks to Ollama on the host by default. For a containerized one:
#   docker compose -f infra/docker-compose.yml --profile with-ollama up --build
#   ... then set OLLAMA_HOST=http://ollama:11434

services:
  postgres:
    image: pgvector/pgvector:pg16      # stock pg16 + the vector extension
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ntt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ntt}
      - POSTGRES_DB=${POSTGRES_DB:-ntt}
    ports:
      # 5433: dev machines usually already have a Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro   # creates the keycloak db
    healthcheck:
      # -U/-d pinned, or this reports healthy while the app's db is still being created.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ntt} -d ${POSTGRES_DB:-ntt}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Creates the bucket and enables versioning. Versioning must be turned on
  # while the bucket is empty, or existing objects are stuck at version "null".
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REPORTS_BUCKET=${REPORTS_BUCKET:-ntt-reports}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$REPORTS_BUCKET &&
      mc version enable local/$$REPORTS_BUCKET &&
      echo 'minio bucket ready: '$$REPORTS_BUCKET
      "
    restart: "no"

  # start-dev = HTTP, no hostname checks. Local only; a deployment needs
  # `start --optimized` with TLS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER:-ntt}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-ntt}
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Realm, roles, client and seed users as code.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the image; health is on the management port 9000.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\nHost: localhost\nConnection: close\n\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Not waited on: JWKS is fetched lazily and tokens fail closed (401)
      # until Keycloak answers, so blocking startup on its ~30s boot would
      # cost more availability than it buys.
      keycloak:
        condition: service_started
    environment:
      - REPORTS_DIR=/data/reports
      - HF_HOME=/data/hf-cache
      - CHAT_DB=/data/chat/chat.db          # legacy SQLite; read only by the migration
      - CHATBOT_PROVIDER=ollama

      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-ntt}:${POSTGRES_PASSWORD:-ntt}@postgres:5432/${POSTGRES_DB:-ntt}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REPORTS_BUCKET=${REPORTS_BUCKET:-ntt-reports}

      # AUTH_DISABLED=1 falls back to the X-Client-Id header. Refused at boot
      # when APP_ENV is production or staging.
      - APP_ENV=${APP_ENV:-development}
      - AUTH_DISABLED=${AUTH_DISABLED:-0}
      # Two issuers: the browser is redirected to the public URL, the backend
      # reaches Keycloak internally. Tokens validate against both.
      - OIDC_ISSUER=${OIDC_ISSUER:-http://keycloak:8080/realms/ntt}
      - OIDC_PUBLIC_ISSUER=${OIDC_PUBLIC_ISSUER:-http://localhost:8080/realms/ntt}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-ntt-platform}
      - OIDC_VERIFY_AUDIENCE=${OIDC_VERIFY_AUDIENCE:-0}
      - CORS_ORIGINS=${CORS_ORIGINS:-}      # empty: the API serves its own SPA

      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      # Near-greedy: this task reproduces documented procedures, so sampling
      # variance is a defect rather than creativity.
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.1}
      # Sized against measured queueing, not single-request latency: Ollama
      # serialises generation, so concurrent askers wait their turn (measured
      # 27s-133s over 226s wall for 8 requests). A ~30s timeout would fail
      # queued requests spuriously. OLLAMA_NUM_PARALLEL=4 was tried and
      # rejected — on one GPU it cut wall time 226s->190s but pushed the
      # fastest request 27s->62s and doubled resident memory.
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}

      - LOG_FORMAT=${LOG_FORMAT:-text}      # text | json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so the alias also resolves on Linux
    volumes:
      - ../reports:/data/reports
      - hf-cache:/data/hf-cache
      - chat-db:/data/chat
    restart: unless-stopped
    # Steady state is ~600 MB. The ceiling absorbs a burst without letting a
    # leak here starve Ollama, which shares host memory.
    mem_limit: 2g

  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  hf-cache:       # sentence-transformers model
  chat-db:        # legacy SQLite history, kept until the migration is verified
  ollama-models:
  pg-data:
  minio-data:
