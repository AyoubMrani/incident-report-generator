<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
  </defs>

  <text x="60" y="28" font-size="11" stroke="none" font-weight="bold">LAYER</text>
  <text x="560" y="28" font-size="11" text-anchor="middle" stroke="none" font-weight="bold">USES THE REAL MODEL?</text>

  <!-- layer 1 -->
  <rect x="40" y="40" width="440" height="58" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="56" y="60" font-size="11.5" stroke="none" font-weight="bold">Component tests — 269 cases, 44 s</text>
  <text x="56" y="77" font-size="10.5" stroke="none">parsing · routing · caching · grounding rules · safety bounds</text>
  <text x="56" y="92" font-size="10" stroke="none" font-style="italic">fast and deterministic — generator is stubbed</text>
  <text x="560" y="72" font-size="11" text-anchor="middle" stroke="none" fill="#a51d2d">no — stubbed</text>
  <text x="680" y="72" font-size="10.5" stroke="none" fill="#a51d2d">CI gate</text>

  <!-- layer 2 -->
  <rect x="40" y="108" width="440" height="58" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="56" y="128" font-size="11.5" stroke="none" font-weight="bold">Corpus sweep — 69 reports, 13 s</text>
  <text x="56" y="145" font-size="10.5" stroke="none">every report must retrieve itself · thresholds · determinism</text>
  <text x="56" y="160" font-size="10" stroke="none" font-style="italic">catches silent corpus-wide regressions</text>
  <text x="560" y="140" font-size="11" text-anchor="middle" stroke="none" fill="#a51d2d">no — retrieval only</text>
  <text x="680" y="140" font-size="10.5" stroke="none" fill="#a51d2d">CI gate</text>

  <!-- divider: the gap -->
  <line x1="40" y1="182" x2="740" y2="182" stroke="#1a5fb4" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="390" y="177" font-size="10.5" text-anchor="middle" stroke="none" fill="#1a5fb4" font-weight="bold">
    ↑ cannot observe model behaviour   ·   ↓ observes it directly
  </text>

  <!-- layer 3 -->
  <rect x="40" y="196" width="440" height="58" rx="5" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="56" y="216" font-size="11.5" stroke="none" font-weight="bold" fill="#1a5fb4">Behavioural suite — 16 cases, ~5 min</text>
  <text x="56" y="233" font-size="10.5" stroke="none">properties that survive sampling — never exact wording</text>
  <text x="56" y="248" font-size="10" stroke="none" font-style="italic">a defect found by hand becomes a case in ~5 lines</text>
  <text x="560" y="228" font-size="11" text-anchor="middle" stroke="none" fill="#2a7a2a" font-weight="bold">yes</text>
  <text x="672" y="228" font-size="10.5" stroke="none">local gate</text>

  <!-- layer 4 -->
  <rect x="40" y="264" width="440" height="58" rx="5" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="56" y="284" font-size="11.5" stroke="none" font-weight="bold" fill="#1a5fb4">Concurrency probe — 8–12 requests, ~4 min</text>
  <text x="56" y="301" font-size="10.5" stroke="none">shared caches and index swap under simultaneous use</text>
  <text x="56" y="316" font-size="10" stroke="none" font-style="italic">exposed queueing; confirmed the confidence ceiling fires</text>
  <text x="560" y="296" font-size="11" text-anchor="middle" stroke="none" fill="#2a7a2a" font-weight="bold">yes</text>
  <text x="672" y="296" font-size="10.5" stroke="none">local gate</text>

  <!-- the rationale -->
  <rect x="40" y="338" width="700" height="46" rx="5" fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="390" y="357" font-size="11" text-anchor="middle" stroke="none" font-weight="bold">
    Every defect that materially affected this system was a generation-behaviour defect.
  </text>
  <text x="390" y="374" font-size="10.5" text-anchor="middle" stroke="none">
    None was reachable by the retrieval benchmark or by stubbed unit tests — which is why the lower two layers exist.
  </text>
</svg>
