<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fb4" stroke="none"/>
    </marker>
  </defs>

  <!-- dialogue side -->
  <rect x="30" y="40" width="230" height="210" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="145" y="62" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Resolved dialogue</text>

  <rect x="46" y="76" width="198" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="93" font-size="10" stroke="none">initiating question</text>
  <rect x="46" y="110" width="198" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="127" font-size="10" stroke="none">diagnosed root cause</text>
  <rect x="46" y="144" width="198" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="161" font-size="10" stroke="none">resolution steps</text>
  <rect x="46" y="178" width="198" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="195" font-size="10" stroke="none">typed artifacts</text>
  <rect x="46" y="212" width="198" height="26" rx="4" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="56" y="229" font-size="10" stroke="none">cited reports</text>

  <!-- mapping arrows -->
  <line x1="244" y1="89"  x2="336" y2="89"  stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="244" y1="123" x2="336" y2="123" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="244" y1="157" x2="336" y2="157" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="244" y1="191" x2="336" y2="191" stroke-width="1.1" marker-end="url(#a)"/>
  <line x1="244" y1="225" x2="336" y2="225" stroke-width="1.1" marker-end="url(#a)"/>
  <text x="290" y="60" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">π⁻¹</text>

  <!-- report side -->
  <rect x="340" y="40" width="230" height="210" rx="6" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="455" y="62" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Structured report</text>

  <rect x="356" y="76" width="198" height="26" rx="4" fill="#fff" stroke="#1a5fb4" stroke-width="1"/>
  <text x="366" y="93" font-size="10" stroke="none">metadata · symptom</text>
  <rect x="356" y="110" width="198" height="26" rx="4" fill="#fff" stroke="#1a5fb4" stroke-width="1"/>
  <text x="366" y="127" font-size="10" stroke="none">paragraph block: root cause</text>
  <rect x="356" y="144" width="198" height="26" rx="4" fill="#fff" stroke="#1a5fb4" stroke-width="1"/>
  <text x="366" y="161" font-size="10" stroke="none">list block: procedure</text>
  <rect x="356" y="178" width="198" height="26" rx="4" fill="#fff" stroke="#1a5fb4" stroke-width="1"/>
  <text x="366" y="195" font-size="10" stroke="none">code blocks</text>
  <rect x="356" y="212" width="198" height="26" rx="4" fill="#fff" stroke="#1a5fb4" stroke-width="1"/>
  <text x="366" y="229" font-size="10" stroke="none">incident_example blocks</text>

  <!-- validation + persist -->
  <path d="M 570 145 L 616 145" fill="none" stroke="#1a5fb4" stroke-width="1.4" marker-end="url(#ab)"/>
  <rect x="620" y="112" width="100" height="66" rx="5" fill="#fff" stroke="#1a5fb4" stroke-width="1.3"/>
  <text x="670" y="132" font-size="10.5" text-anchor="middle" stroke="none">validated</text>
  <text x="670" y="148" font-size="10.5" text-anchor="middle" stroke="none">against the</text>
  <text x="670" y="164" font-size="10.5" text-anchor="middle" stroke="none">same schema</text>

  <!-- grounding rule -->
  <rect x="30" y="268" width="690" height="46" rx="5" fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="375" y="287" font-size="11" text-anchor="middle" stroke="none" font-weight="bold">
    Strict grounding: a field not determined by the dialogue is left empty, never filled by inference.
  </text>
  <text x="375" y="304" font-size="10.5" text-anchor="middle" stroke="none">
    The synthesized report is indistinguishable downstream — editable, and retrievable as corpus for the next question.
  </text>
</svg>
