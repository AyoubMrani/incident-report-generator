<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 360" width="790" height="360"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7a2a" stroke="none"/>
    </marker>
  </defs>

  <rect x="40" y="150" width="140" height="46" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="1.3"/>
  <text x="110" y="178" font-size="12" text-anchor="middle" stroke="none" font-weight="bold">incoming turn</text>

  <line x1="180" y1="173" x2="222" y2="173" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- classifier -->
  <rect x="226" y="140" width="150" height="66" rx="6" fill="#fafafa" stroke="#111" stroke-width="1.4"/>
  <text x="301" y="165" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Intent classifier</text>
  <text x="301" y="183" font-size="10" text-anchor="middle" stroke="none">lexical patterns +</text>
  <text x="301" y="197" font-size="10" text-anchor="middle" stroke="none">diagnosable-content test</text>

  <!-- four outcomes -->
  <path d="M 376 156 L 430 156 L 430 40 L 470 40" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="474" y="22" width="236" height="36" rx="5" fill="#f7f7f7" stroke="#111" stroke-width="1.1"/>
  <text x="486" y="45" font-size="10.5" stroke="none">greeting / smalltalk / meta → chat reply</text>

  <path d="M 376 164 L 442 164 L 442 92 L 470 92" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="474" y="74" width="236" height="36" rx="5" fill="#f7f7f7" stroke="#111" stroke-width="1.1"/>
  <text x="486" y="97" font-size="10.5" stroke="none">out of scope → courteous decline</text>

  <path d="M 376 182 L 442 182 L 442 144 L 470 144" fill="none" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="474" y="126" width="236" height="36" rx="5" fill="#f7f7f7" stroke="#111" stroke-width="1.1"/>
  <text x="486" y="149" font-size="10.5" stroke="none">too vague → ask for specifics</text>

  <path d="M 301 206 L 301 250 L 470 250" fill="none" stroke="#2a7a2a" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="474" y="230" width="236" height="42" rx="5" fill="#eef7ee" stroke="#2a7a2a" stroke-width="1.5"/>
  <text x="592" y="248" font-size="11" text-anchor="middle" stroke="none" font-weight="bold" fill="#2a7a2a">diagnosable incident</text>
  <text x="592" y="264" font-size="10.5" text-anchor="middle" stroke="none">→ retrieval and generation</text>
  <text x="386" y="243" font-size="10" stroke="none" fill="#2a7a2a">only this path</text>

  <!-- the bracket: three of four never reach a model -->
  <path d="M 722 22 L 734 22 L 734 162 L 722 162" fill="none" stroke="#a51d2d" stroke-width="1.3"/>
  <text x="752" y="92" font-size="10.5" stroke="none" fill="#a51d2d" transform="rotate(90 752 92)"
        text-anchor="middle">no generator is invoked</text>

  <!-- the claim -->
  <rect x="60" y="290" width="620" height="50" rx="5" fill="#fff" stroke="#111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="370" y="310" font-size="11" text-anchor="middle" stroke="none" font-weight="bold">
    Because the model is never called on the three upper paths, fabrication there is structurally impossible —
  </text>
  <text x="370" y="328" font-size="11" text-anchor="middle" stroke="none">
    a property of the control flow, not a request made in the prompt.
  </text>

  <!-- follow-up exemption -->
  <text x="301" y="228" font-size="9.5" text-anchor="middle" stroke="none" font-style="italic">follow-ups exempt: history supplies context</text>
</svg>
