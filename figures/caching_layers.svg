<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"
     font-family="Helvetica, Arial, sans-serif" fill="#111" stroke="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111" stroke="none"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7a2a" stroke="none"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a5fb4" stroke="none"/>
    </marker>
  </defs>

  <!-- ── answer cache row ─────────────────────────────────────── -->
  <text x="30" y="34" font-size="12" stroke="none" font-weight="bold">Per request</text>

  <rect x="30" y="46" width="120" height="44" rx="5" fill="#f2f2f2" stroke="#111" stroke-width="1.3"/>
  <text x="90" y="73" font-size="11.5" text-anchor="middle" stroke="none">question</text>

  <line x1="150" y1="68" x2="196" y2="68" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="200" y="46" width="170" height="44" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="285" y="66" font-size="11" text-anchor="middle" stroke="none">retrieve + select</text>
  <text x="285" y="82" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">66 ms</text>

  <line x1="370" y1="68" x2="416" y2="68" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="420" y="40" width="180" height="56" rx="5" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.6"/>
  <text x="510" y="60" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Answer cache</text>
  <text x="510" y="77" font-size="10.5" text-anchor="middle" stroke="none">keyed on the FULL prompt</text>
  <text x="510" y="91" font-size="9.5" text-anchor="middle" stroke="none">LRU · 128 entries</text>

  <!-- hit path -->
  <path d="M 510 96 L 510 126 L 690 126" fill="none" stroke="#2a7a2a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="600" y="120" font-size="10.5" text-anchor="middle" stroke="none" fill="#2a7a2a" font-weight="bold">hit → 0.04 s</text>

  <!-- miss path -->
  <line x1="600" y1="68" x2="646" y2="68" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="650" y="46" width="100" height="44" rx="5" fill="#f2f2f2" stroke="#111" stroke-width="1.3"/>
  <text x="700" y="66" font-size="11" text-anchor="middle" stroke="none">generate</text>
  <text x="700" y="82" font-size="10.5" text-anchor="middle" stroke="none" font-style="italic">28 s</text>
  <text x="624" y="60" font-size="10" text-anchor="middle" stroke="none">miss</text>

  <!-- what makes it safe -->
  <rect x="200" y="150" width="400" height="58" rx="5" fill="#fff" stroke="#1a5fb4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="214" y="169" font-size="10.5" stroke="none" fill="#1a5fb4" font-weight="bold">Why keying on the prompt makes it safe, not merely fast:</text>
  <text x="214" y="186" font-size="10.5" stroke="none">the prompt already contains the evidence, history and corrections —</text>
  <text x="214" y="202" font-size="10.5" stroke="none">re-index or a new correction ⇒ different key ⇒ a stale answer is unreachable</text>
  <line x1="470" y1="96" x2="470" y2="146" stroke="#1a5fb4" stroke-width="1.1" stroke-dasharray="4 3"/>

  <!-- ── embedding cache row ──────────────────────────────────── -->
  <line x1="30" y1="232" x2="750" y2="232" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="258" font-size="12" stroke="none" font-weight="bold">Per start-up</text>

  <rect x="30" y="270" width="150" height="52" rx="5" fill="#eef4fb" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="105" y="291" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold" fill="#1a5fb4">Report corpus</text>
  <text x="105" y="308" font-size="10.5" text-anchor="middle" stroke="none">69 reports → 141 chunks</text>

  <line x1="180" y1="296" x2="226" y2="296" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="230" y="264" width="230" height="64" rx="5" fill="#fafafa" stroke="#111" stroke-width="1.3"/>
  <text x="345" y="284" font-size="11.5" text-anchor="middle" stroke="none" font-weight="bold">Embedding cache</text>
  <text x="345" y="301" font-size="10.5" text-anchor="middle" stroke="none">key = SHA-256(model name + all chunk text)</text>
  <text x="345" y="318" font-size="10" text-anchor="middle" stroke="none" font-style="italic">any edit changes the key automatically</text>

  <path d="M 460 282 L 530 282" fill="none" stroke="#2a7a2a" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="560" y="286" font-size="10.5" stroke="none" fill="#2a7a2a">hit → load vectors, 7 s boot</text>
  <path d="M 460 312 L 530 312" fill="none" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="560" y="316" font-size="10.5" stroke="none">miss → re-encode, 37 s boot</text>

  <!-- invalidation edge -->
  <path d="M 105 322 L 105 360 L 510 360 L 510 340" fill="none" stroke="#1a5fb4" stroke-width="1.3"
        stroke-dasharray="5 3" marker-end="url(#ab)"/>
  <text x="300" y="376" font-size="10.5" text-anchor="middle" stroke="none" fill="#1a5fb4">
    a report written or deleted invalidates both caches and re-indexes in the background
  </text>
</svg>
